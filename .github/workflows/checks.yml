name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'snowflake-snowpark-python>=1.35,<2' 'python-dotenv>=1,<2'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py utils
